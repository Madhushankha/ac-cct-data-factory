<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripTracer QA · {{ENV}}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5b6470; --accent:#d22630; --line:#e3e6ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --card:#1d2127; --ink:#e7eaee; --muted:#9aa3ad; --line:#2b3038; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  header b { font-size:16px; } .chip { background:var(--accent); color:#fff; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; }
  main { max-width:820px; margin:0 auto; padding:16px; padding-bottom:140px; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:10px 0; white-space:pre-wrap; }
  .me { border-left:3px solid var(--accent); }
  .step { font:12px ui-monospace, Menlo, monospace; color:var(--muted); margin:4px 0 0; white-space:pre-wrap; }
  .zz { font-weight:600; }
  form { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px; }
  .row { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:64px; border-radius:10px; border:1px solid var(--line); padding:10px; font:inherit; background:var(--card); color:var(--ink); }
  button { border:0; border-radius:10px; background:var(--accent); color:#fff; padding:0 18px; font-weight:600; }
  .hint { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header><b>TripTracer QA</b><span class="chip">{{ENV}}</span><span class="hint">Describe a scenario; get test bookings in this environment.</span></header>
<main id="log">
  <div class="msg hint">Try: “Two bookings where a passenger misconnected and was rebooked”, “a group booking with checked bags”, “a denied boarding”. Bookings are real Air Canada histories with synthetic identities (ZZ references).</div>
</main>
<form id="f"><div class="row"><textarea id="t" placeholder="Describe the scenario…" required></textarea><button>Send</button></div></form>
<script>
const log = document.getElementById("log"), t = document.getElementById("t"), msgs = [];
// A booking the chat checked links to its Trip (/booking/<pnr-id>, from the check's search rows); one it did not check
// opens TripTracer's search for it (Suresh, 2026-10-15: "/?q=" found nothing).
function bookingHref(z, steps) {
  for (const s of steps || []) for (const row of (s.tool === "check_booking" && s.result && s.result.rows) || []) {
    const id = row.pnrId || row.id || "";
    if (id.toUpperCase().startsWith(z + "-")) return `/booking/${encodeURIComponent(id)}`;
  }
  return `/search?q=${z}&type=pnr`;
}
function add(cls, text, steps) {
  const d = document.createElement("div"); d.className = "msg " + cls;
  d.innerHTML = text.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\bZZ[A-Z0-9]{4}\b/g, z => `<a class="zz" href="${bookingHref(z, steps)}" target="_blank">${z}</a>`);
  (steps || []).forEach(s => { const p = document.createElement("div"); p.className = "step";
    p.textContent = `${s.tool} ${JSON.stringify(s.input)} → ${JSON.stringify(s.result)}`; d.appendChild(p); });
  log.appendChild(d); window.scrollTo(0, document.body.scrollHeight);
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault(); const text = t.value.trim(); if (!text) return;
  t.value = ""; add("me", text); msgs.push({role: "user", text});
  add("hint", "Working…");
  const working = log.lastChild;
  const r = await fetch("/qa/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({messages: msgs})});
  if (r.status === 401) { location.href = "/login?next=%2Fqa%2F"; return; }
  // The turn runs as a job on the server; poll its lines: progress while Claude thinks or a tool runs, one per tool
  // step, then the reply. (The edge ends any single response at 30 s, so the answer cannot stream.)
  let j = null, done = 0, seconds = 0, from = 0;
  const show = () => { working.textContent = `Working… ${done ? done + " step" + (done > 1 ? "s" : "") + " done, " : ""}${seconds}s`; };
  const start = await r.json().catch(() => ({error: `Error ${r.status}`}));
  if (!r.ok || !start.job) j = start;
  else for (const t0 = Date.now();;) {
    await new Promise(ok => setTimeout(ok, 2000));
    const p = await fetch(`/qa/api/chat/${start.job}?start=${from}`).then(x => x.json()).catch(() => null);
    seconds = Math.round((Date.now() - t0) / 1000);
    if (!p) { show(); continue; }  // a dropped poll: try again
    if (p.error) { j = {error: "The server restarted during this answer; try again."}; break; }
    from += p.lines.length;
    for (const o of p.lines) { if (o.step) done++; else if (!o.wait) j = o; }
    show();
    if (p.done) break;
  }
  working.remove();
  j = j || {error: "The answer was cut off; try again."};
  add("", j.reply || j.error || "No answer.", j.steps); msgs.push({role: "assistant", text: j.reply || ""});
};
t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
</script>
</body>
</html>
