# Chrome for the chat automation, in Docker and memory-capped so a big parallel run cannot take the PC down.
# One Playwright browser server; each worker that connects gets its own browser inside it.
#   docker compose up -d     ws://127.0.0.1:3000/  (the suite uses it with PW_WS_ENDPOINT=ws://127.0.0.1:3000/)
#   docker compose down
# 10 chats need about 7-8 GB; the cap leaves the rest of the PC alone.
services:
  chrome:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    command: ["/bin/sh", "-c", "cd /home/pwuser && npx -y playwright@1.64.0 run-server --port 3000 --host 0.0.0.0"]
    init: true
    user: pwuser
    ipc: host
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 10g
    cpus: 8
    restart: on-failure
