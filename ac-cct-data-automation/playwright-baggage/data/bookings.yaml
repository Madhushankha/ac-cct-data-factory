# Booking pools (guide section 12). Scenarios pick by pool + state tags:
#   booking: { pool: any, pick: next-unused, need: [open], avoid: [partner, waiting] }
# or name one:  booking: { pnr: WESDIF }
#
# otp.provider:
#   mailinator  the shared private inbox; codes fetched automatically (needs MAILINATOR_API_TOKEN or AWS creds)
#   manual      the code goes to a real mailbox; the run waits for `npm run otp -- <PNR> <code>`
#
# Usage (used / reserved / claimConfirmed) is NOT kept here: see state/booking-ledger.json.
# Regenerate a pool from a seed report: npm run import-seed -- ../../baggage/<file>.html
#
# The guide's v77 set (all IDRIS, codes to the shared Mailinator inbox) is not on this machine. Add it like:
#   v77:
#     dataset: baggage-sit-int-v77
#     otp: { provider: mailinator, domain: ae-qa1-aircanada.mailinator.com, inbox: lahiru }
#     first: Idris
#     bookings:
#       - { pnr: FYO4TS, last: Sorvaswen, flight: AC9803, landed: 2026-09-13, tags: [open, lost] }
